<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroNova - Mis Favoritos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- CSS Propio del Proyecto -->
    <link rel="stylesheet" href="../css/css.css">
</head>
<body class="bg-light">

    <!-- CONTENEDOR DEL NAVBAR DINÁMICO -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DE LA WISHLIST -->
    <div class="container my-4">
        <h2 class="fw-bold text-dark mb-3">
            <i class="fa-solid fa-heart text-danger"></i> Mi Lista de Deseos
        </h2>
        <hr class="mb-4 text-secondary">
        
        <div class="row" id="contenedorWishlist">
            <!-- Los productos favoritos se cargan dinámicamente -->
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPT PRINCIPAL -->
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar el header externo dinámico
            cargarHeader('header-container');

            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'cliente') {
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Restringido',
                    text: 'Debe iniciar sesión para ver sus favoritos.'
                }).then(() => {
                    window.location.href = 'login.html';
                });
                return;
            }

            cargarWishlist();
        });

        function cargarWishlist() {
            const sesion = getSesionActual();
            const wishlistGeneral = JSON.parse(localStorage.getItem('wishlist')) || [];
            
            // Filtramos solo los favoritos del usuario actual
            const misFavoritos = wishlistGeneral.filter(item => item.email === sesion.email);
            const contenedor = document.getElementById('contenedorWishlist');

            if (misFavoritos.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-light text-center shadow-sm p-5 border">
                            <i class="fa-regular fa-heart fa-3x text-muted mb-3"></i>
                            <h4 class="alert-heading text-dark">Aún no tienes favoritos</h4>
                            <p class="text-muted">Explora nuestro catálogo y guarda los accesorios que más te gusten presionando el corazón.</p>
                            <a href="../../index.html" class="btn btn-primary mt-2">Ir al Catálogo</a>
                        </div>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = misFavoritos.map(p => `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card h-100 product-card shadow-sm border">
                        <!-- Botón de Favorito Flotante -->
                        <button class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow-sm border" 
                                onclick="toggleWishlist(${p.id})" title="Quitar de favoritos" style="z-index: 10;">
                            <i class="fa-solid fa-heart text-danger"></i>
                        </button>
                        
                        <div class="bg-white p-3 text-center">
                            <img src="${p.imagen}" class="card-img-top img-fluid" alt="${p.nombre}" style="height: 180px; object-fit: contain;">
                        </div>
                        
                        <div class="card-body d-flex flex-column text-center bg-white border-top">
                            <h6 class="card-title text-dark mb-2">${p.nombre}</h6>
                            <p class="card-text text-success fw-bold fs-5 mb-3">$${p.precio.toFixed(2)}</p>
                            <button class="btn btn-outline-primary mt-auto w-100" onclick="agregarAlCarrito(${p.id})">
                                <i class="fa-solid fa-cart-plus me-1"></i> Mover al Carrito
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function agregarAlCarrito(id) {
            let productos = JSON.parse(localStorage.getItem('productos')) || [];
            let producto = productos.find(p => p.id === id);
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

            carrito.push(producto);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            
            // Quitar el producto de favoritos al moverlo al carrito
            toggleWishlist(id);
            
            Swal.fire({
                icon: 'success',
                title: '¡Agregado!',
                text: `"${producto.nombre}" se agregó al carrito.`,
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000
            });
            
            // Refrescar el header para actualizar el contador del carrito
            cargarHeader('header-container');
        }
    </script>
</body>
</html>
