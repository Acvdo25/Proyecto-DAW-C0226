<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Mis Compras</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/css.css">
</head>

<body class="bg-light">

    <!-- CONTENEDOR DEL NAVBAR DINÁMICO -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DEL HISTORIAL -->
    <div class="container my-4" id="contenedorHistorial">
        <!-- Los pedidos del cliente se cargan dinámicamente mediante JavaScript -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPT PRINCIPAL (Subiendo un nivel con ../ para llegar a src/js/app.js) -->
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');

            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'cliente') {
                alert('Debe iniciar sesión como cliente para ver su historial.');
                window.location.href = 'login.html';
                return;
            }

            cargarHistorial();
        });

        function cargarHistorial() {
            const sesion = getSesionActual();
            let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];

            // Filtramos únicamente los pedidos que coincidan con el correo del cliente conectado
            let misPedidos = pedidos.filter(p => p.email === sesion.email);
            let contenedor = document.getElementById('contenedorHistorial');

            let html = misPedidos.map(p => `
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <span><strong>Código de Ticket:</strong> ${p.ticket}</span>
                        <span><strong>Estado:</strong> <span class="badge ${p.estado === 'Entregado' ? 'bg-success' : 'bg-warning text-dark'}">${p.estado}</span></span>
                    </div>
                    <div class="card-body">
                        <p class="mb-2"><strong>Cliente:</strong> ${p.cliente}</p>
                        <p class="mb-2"><strong>Total Pagado:</strong> $${p.total.toFixed(2)}</p>
                        <h6 class="mt-3">Accesorios Adquiridos:</h6>
                        <ul class="list-group mb-2">
                            ${p.productos.map(prod => `
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span>${prod.nombre} (${prod.categoria})</span>                                     <span class="text-success fw-bold">$${prod.precio.toFixed(2)}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');

            contenedor.innerHTML = `
                <h2>Historial de Mis Compras</h2>
                <hr>
                ${misPedidos.length === 0 ? `
                    <div class="alert alert-info text-center">
                        <p class="mb-0">Aún no ha realizado ningún pedido ni generado tickets.</p>
                        <a href="../../index.html" class="btn btn-primary mt-3">Ver Catálogo de Productos</a>
                    </div>
                ` : html}
            `;
        }
    </script>
</body>

</html>
