<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link rel="stylesheet" href="../css/css.css">
</head>

<body class="bg-light">
    <div id="header-container"></div>
    <div id="react-root" class="container mt-5 mb-5"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof cargarHeader === 'function') cargarHeader('header-container');
            fetch('../layout/footer.html')
                .then(res => res.ok ? res.text() : Promise.reject('Error footer'))
                .then(html => document.getElementById('footer-container').innerHTML = html)
                .catch(err => console.error(err));
        });
    </script>

    <script type="text/babel">
        const { useState } = React;

        function RegistroReact() {
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPass, setConfirmPass] = useState('');

            const [valNombre, setValNombre] = useState(null);
            const [valEmail, setValEmail] = useState(null);
            const [valPass, setValPass] = useState(null);
            const [valConf, setValConf] = useState(null);

            const checkNombre = (val) => {
                setNombre(val);
                const regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
                setValNombre(regex.test(val) && val.trim().length > 2);
            };

            const checkEmail = (val) => {
                setEmail(val);
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                setValEmail(regex.test(val));
            };

            const checkPass = (val) => {
                setPassword(val);
                // Validación simplificada: solo requiere al menos 6 caracteres
                const isValid = val.length >= 6;
                setValPass(isValid);
                if (confirmPass.length > 0) setValConf(val === confirmPass);
            };

            const checkConf = (val) => {
                setConfirmPass(val);
                setValConf(val === password && val.length > 0);
            };

            const manejarSubmit = (e) => {
                e.preventDefault();

                if (!valNombre || !valEmail || !valPass || !valConf) {
                    Swal.fire({ icon: 'error', title: 'Error de validación', text: 'Revise los campos marcados en rojo.' });
                    return;
                }

                let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
                if (usuarios.some(u => u.email === email)) {
                    Swal.fire({ icon: 'warning', title: 'Correo en uso', text: 'El correo electrónico ya está registrado.' });
                    return;
                }

                usuarios.push({ email, password, rol: 'cliente', nombre: nombre.trim() });
                localStorage.setItem('usuarios', JSON.stringify(usuarios));

                Swal.fire({
                    icon: 'success',
                    title: '¡Registro exitoso!',
                    text: 'Su cuenta ha sido creada. Ahora inicie sesión.',
                    showConfirmButton: false,
                    timer: 2000
                }).then(() => {
                    window.location.href = 'login.html';
                });
            };

            const getClass = (isValid) => {
                if (isValid === null) return 'form-control';
                return isValid ? 'form-control is-valid' : 'form-control is-invalid';
            };

            return (
                <div className="row justify-content-center">
                    <div className="col-md-6">
                        <div className="card shadow p-4 border-0 rounded-3 bg-white">
                            <div className="text-center mb-4">
                                <div className="bg-success text-white d-inline-block rounded-circle p-3 mb-3">
                                    <i className="fa-solid fa-user-plus fa-2x"></i>
                                </div>
                                <h3 className="fw-bold text-dark">Registro de Cliente</h3>
                            </div>
                            <form onSubmit={manejarSubmit} noValidate>
                                <div className="mb-3">
                                    <label className="form-label fw-semibold text-secondary">Nombre Completo</label>
                                    <input type="text" className={getClass(valNombre)} value={nombre} onChange={(e) => checkNombre(e.target.value)} required placeholder="Ej. Juan Pérez" />
                                    <div className="invalid-feedback">Solo se permiten letras y debe ser mayor a 2 caracteres.</div>
                                </div>
                                <div className="mb-3">
                                    <label className="form-label fw-semibold text-secondary">Correo Electrónico</label>
                                    <input type="email" className={getClass(valEmail)} value={email} onChange={(e) => checkEmail(e.target.value)} required placeholder="ejemplo@correo.com" />
                                    <div className="invalid-feedback">Formato de correo no válido.</div>
                                </div>
                                <div className="mb-3">
                                    <label className="form-label fw-semibold text-secondary">Contraseña</label>
                                    <input type="password" className={getClass(valPass)} value={password} onChange={(e) => checkPass(e.target.value)} required placeholder="••••••••" />
                                    <div className="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
                                </div>
                                <div className="mb-4">
                                    <label className="form-label fw-semibold text-secondary">Confirmar Contraseña</label>
                                    <input type="password" className={getClass(valConf)} value={confirmPass} onChange={(e) => checkConf(e.target.value)} required placeholder="••••••••" />
                                    <div className="invalid-feedback">Las contraseñas no coinciden.</div>
                                </div>
                                <button type="submit" className="btn btn-success w-100 fw-bold py-2 shadow-sm">Crear Cuenta</button>
                            </form>
                            <div className="text-center mt-4">
                                <p className="text-muted small">¿Ya tienes una cuenta? <a href="login.html" className="text-decoration-none fw-semibold">Inicia Sesión aquí</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(<RegistroReact />);
    </script>
</body>

</html>
