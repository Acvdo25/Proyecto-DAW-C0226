<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/css.css">
</head>

<body class="bg-light">
    <div id="header-container"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3">Registro de Cliente</h3>
                    <form onsubmit="procesarRegistro(event)">
                        <div class="mb-3"><label class="form-label">Nombre Completo</label><input type="text"
                                class="form-control" id="regNombre" required></div>
                        <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email"
                                class="form-control" id="regEmail" required></div>
                        <div class="mb-3"><label class="form-label">Contraseña</label><input type="password"
                                class="form-control" id="regPass" required></div>
                        <button type="submit" class="btn btn-success w-100">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => renderizarNavbar('menuNavbar'));

        function procesarRegistro(e) {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            if (usuarios.some(u => u.email === email)) {
                alert('El correo ya está registrado.');
                return;
            }

            usuarios.push({ email, password, rol: 'cliente', nombre });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            alert('¡Registro exitoso! Inicie sesión.');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
