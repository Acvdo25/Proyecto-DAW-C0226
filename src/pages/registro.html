<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ElectroNova - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/css.css">
</head>
<body class="bg-light">
    <div id="header-container"></div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 border-0 rounded-3">
                    <h3 class="text-center mb-4 fw-bold">Registro de Cliente</h3>
                    <form onsubmit="procesarRegistro(event)" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="regNombre" oninput="validarNombre(this)" required>
                            <div class="invalid-feedback">Solo se permiten letras y espacios.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" oninput="validarCorreoReg(this)" required>
                            <div class="invalid-feedback">Formato de correo no válido.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="regPass" oninput="validarPassFuerte(this)" required>
                            <div class="invalid-feedback">Debe contener mín. 8 caracteres, una mayúscula, un número y un carácter especial.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirmar Contraseña</label>
                            <input type="password" class="form-control" id="regPassConf" oninput="validarCoincidencia()" required>
                            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Crear Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => cargarHeader('header-container'));

        function validarNombre(input) {
            const regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
            input.classList.toggle('is-valid', regex.test(input.value) && input.value.trim().length > 2);
            input.classList.toggle('is-invalid', !regex.test(input.value) || input.value.trim().length <= 2);
            return input.classList.contains('is-valid');
        }

        function validarCorreoReg(input) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            input.classList.toggle('is-valid', regex.test(input.value));
            input.classList.toggle('is-invalid', !regex.test(input.value));
            return input.classList.contains('is-valid');
        }

        function validarPassFuerte(input) {
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            input.classList.toggle('is-valid', regex.test(input.value));
            input.classList.toggle('is-invalid', !regex.test(input.value));
            validarCoincidencia(); 
            return input.classList.contains('is-valid');
        }

        function validarCoincidencia() {
            const pass = document.getElementById('regPass').value;
            const conf = document.getElementById('regPassConf');
            if (conf.value.length === 0) return false;
            
            const coincide = pass === conf.value;
            conf.classList.toggle('is-valid', coincide);
            conf.classList.toggle('is-invalid', !coincide);
            return coincide;
        }

        function procesarRegistro(e) {
            e.preventDefault();
            const nombre = document.getElementById('regNombre');
            const email = document.getElementById('regEmail');
            const pass = document.getElementById('regPass');

            if (!validarNombre(nombre) || !validarCorreoReg(email) || !validarPassFuerte(pass) || !validarCoincidencia()) {
                Swal.fire({ icon: 'error', title: 'Error de validación', text: 'Revise los campos en rojo. La contraseña debe cumplir los requisitos de seguridad.' });
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            if(usuarios.some(u => u.email === email.value)) {
                Swal.fire({ icon: 'warning', title: 'Correo en uso', text: 'El correo electrónico ya está registrado en el sistema.' });
                return;
            }

            usuarios.push({ email: email.value, password: pass.value, rol: 'cliente', nombre: nombre.value.trim() });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            
            Swal.fire({
                icon: 'success', title: '¡Registro exitoso!', text: 'Su cuenta ha sido creada. Ahora inicie sesión.', showConfirmButton: false, timer: 2000
            }).then(() => {
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
