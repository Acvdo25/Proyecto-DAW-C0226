<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <!-- CONTENEDOR DEL NAVBAR DINÁMICO -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DEL PANEL -->
    <div class="container my-4" id="contenedorAdmin">
        <!-- El contenido del CRUD y pedidos se carga por JavaScript -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Cargar el header externo
            cargarHeader('header-container');

            // 2. Validar que el usuario sea administrador antes de mostrar el panel
            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'admin') {
                alert('Acceso denegado. Se requieren permisos de administrador.');
                window.location.href = '../../index.html';
                return;
            }
        });
    </script>
</body>

</html>
