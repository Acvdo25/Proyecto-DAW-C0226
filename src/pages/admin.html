<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Panel Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/css.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Librería Chart.js para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

    <!-- CONTENEDOR DEL NAVBAR DINÁMICO -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DEL PANEL -->
    <div class="container my-4" id="contenedorAdmin">
        <!-- El contenido del CRUD y pedidos se carga por JavaScript -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');
            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'admin') {
                Swal.fire({ icon: 'error', title: 'Acceso Denegado', text: 'Se requieren permisos de administrador.' }).then(() => { window.location.href = '../../index.html'; });
                return;
            }
            cargarPanelAdmin();
        });

        function cargarPanelAdmin() {
            let productos = JSON.parse(localStorage.getItem('productos')) || [];
            let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];
            let contenedor = document.getElementById('contenedorAdmin');

            let filasProductos = productos.map(p => `
                <tr>
                    <td><img src="${p.imagen}" style="width: 40px; height: 40px; object-fit: cover;" class="rounded"></td>
                    <td>${p.nombre}</td>
                    <td>$${p.precio.toFixed(2)}</td>
                    <td>${p.categoria}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="abrirModalEditar(${p.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${p.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            let filasPedidos = pedidos.map(p => `
                <tr>
                    <td>${p.ticket}</td>
                    <td>${p.cliente}</td>
                    <td>$${p.total.toFixed(2)}</td>
                    <td><span class="badge ${p.estado === 'Entregado' ? 'bg-success' : 'bg-warning'}">${p.estado}</span></td>
                    <td>
                        ${p.estado === 'Pendiente de Entrega' ? `<button class="btn btn-sm btn-success" onclick="marcarEntregado('${p.ticket}')">Marcar Entregado</button>` : 'Completado'}
                    </td>
                </tr>
            `).join('');

            contenedor.innerHTML = `
                <h2>Panel de Administración</h2>
                <hr>
                
                <!-- NUEVO MÓDULO DE ESTADÍSTICAS -->
                <h4 class="mt-4 text-primary"><i class="fa-solid fa-chart-pie"></i> Reportes y Estadísticas</h4>
                <div class="row mb-5">
                    <div class="col-md-6">
                        <div class="card shadow-sm p-3">
                            <canvas id="graficaProductos"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm p-3">
                            <canvas id="graficaMeses"></canvas>
                        </div>
                    </div>
                </div>

                <h4 class="mt-4">Gestión de Inventario (CRUD)</h4>
                <button class="btn btn-primary mb-3" onclick="abrirModalCrear()"><i class="fa-solid fa-plus"></i> Agregar Nuevo Accesorio</button>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped bg-white shadow-sm">
                        <thead class="table-dark"><tr><th>Img</th><th>Nombre</th><th>Precio</th><th>Categoría</th><th>Stock</th><th>Acciones</th></tr></thead>
                        <tbody>${filasProductos.length === 0 ? '<tr><td colspan="6" class="text-center">No hay productos.</td></tr>' : filasProductos}</tbody>
                    </table>
                </div>

                <h4 class="mt-5">Gestión de Pedidos y Entregas</h4>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped bg-white shadow-sm">
                        <thead class="table-dark"><tr><th>Ticket</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead>
                        <tbody>${filasPedidos.length === 0 ? '<tr><td colspan="5" class="text-center">No hay pedidos registrados.</td></tr>' : filasPedidos}</tbody>
                    </table>
                </div>

                <!-- MODAL FORMULARIO PRODUCTO (Reemplazar en admin.html) -->
                <div class="modal fade" id="modalProducto" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modalTitulo">Gestión de Producto</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="formProducto" onsubmit="guardarProducto(event)" novalidate>
                                    <input type="hidden" id="prodId">
                                    <div class="mb-3">
                                        <label>Nombre del Accesorio</label>
                                        <input type="text" class="form-control" id="prodNombre" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>Precio ($)</label>
                                        <input type="number" step="0.01" min="0.01" class="form-control" id="prodPrecio" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>Categoría</label>
                                        <select class="form-select" id="prodCategoria" required>
                                            <option value="" disabled selected>Seleccione una categoría...</option>
                                            <option value="Audio">Audio</option>
                                            <option value="Carga">Carga</option>
                                            <option value="Carga Apple">Carga Apple</option>
                                            <option value="Carga Samsung">Carga Samsung</option>
                                            <option value="Carga Huawei">Carga Huawei</option>
                                            <option value="Wearables">Wearables</option>
                                            <option value="Protección">Protección</option>
                                            <option value="Conectividad">Conectividad</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label>Stock</label>
                                        <input type="number" min="0" step="1" class="form-control" id="prodStock" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>URL de Imagen</label>
                                        <input type="url" class="form-control" id="prodImagen" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Guardar Cambios</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // LLAMAMOS A LA FUNCIÓN DE GRÁFICAS
            renderizarGraficas();
        }

        function abrirModalCrear() {
            document.getElementById('prodId').value = '';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodCategoria').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodImagen').value = '';
            document.getElementById('modalTitulo').innerText = 'Crear Nuevo Producto';
            new bootstrap.Modal(document.getElementById('modalProducto')).show();
        }

        function abrirModalEditar(id) {
            let productos = JSON.parse(localStorage.getItem('productos'));
            let p = productos.find(item => item.id === id);
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodCategoria').value = p.categoria;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodImagen').value = p.imagen;
            document.getElementById('modalTitulo').innerText = 'Editar Producto';
            new bootstrap.Modal(document.getElementById('modalProducto')).show();
        }

       // Reemplazar la función guardarProducto en los scripts de admin.html
        function guardarProducto(e) {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const categoria = document.getElementById('prodCategoria').value;
            const stock = parseInt(document.getElementById('prodStock').value);
            const imagen = document.getElementById('prodImagen').value.trim();

            // Validaciones avanzadas
            if (!nombre || categoria === "") {
                Swal.fire({ icon: 'error', title: 'Datos incompletos', text: 'Por favor, complete todos los campos de texto y seleccione una categoría.' });
                return;
            }
            if (isNaN(precio) || precio <= 0) {
                Swal.fire({ icon: 'error', title: 'Precio Inválido', text: 'El precio debe ser un número mayor a 0.' });
                return;
            }
            if (isNaN(stock) || stock < 0) {
                Swal.fire({ icon: 'error', title: 'Stock Inválido', text: 'El stock no puede ser un número negativo.' });
                return;
            }
            
            const urlRegex = /^(https?:\/\/)/i;
            if (!urlRegex.test(imagen)) {
                Swal.fire({ icon: 'error', title: 'URL Inválida', text: 'El enlace de la imagen debe comenzar con http:// o https://' });
                return;
            }

            let productos = JSON.parse(localStorage.getItem('productos')) || [];

            if (id) {
                let index = productos.findIndex(p => p.id == id);
                productos[index] = { id: parseInt(id), nombre, precio, categoria, stock, imagen };
            } else {
                const nuevoId = productos.length > 0 ? productos[productos.length - 1].id + 1 : 1;
                productos.push({ id: nuevoId, nombre, precio, categoria, stock, imagen });
            }

            localStorage.setItem('productos', JSON.stringify(productos));
            bootstrap.Modal.getInstance(document.getElementById('modalProducto')).hide();
            
            Swal.fire({ icon: 'success', title: '¡Guardado!', text: 'El producto se ha guardado correctamente en el inventario.', showConfirmButton: false, timer: 1500 });
            cargarPanelAdmin();
        }

        function eliminarProducto(id) {
            Swal.fire({
                title: '¿Está seguro?',
                text: "No podrá revertir esta acción.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    let productos = JSON.parse(localStorage.getItem('productos'));
                    productos = productos.filter(p => p.id !== id);
                    localStorage.setItem('productos', JSON.stringify(productos));
                    cargarPanelAdmin();
                    Swal.fire('¡Eliminado!', 'El producto ha sido borrado.', 'success');
                }
            });
        }

        function marcarEntregado(ticket) {
            let pedidos = JSON.parse(localStorage.getItem('pedidos'));
            let pedido = pedidos.find(p => p.ticket === ticket);
            if (pedido) {
                pedido.estado = 'Entregado';
                localStorage.setItem('pedidos', JSON.stringify(pedidos));
                cargarPanelAdmin();
            }
        }

        function renderizarGraficas() {
            const pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];

            // Lógica para: PRODUCTOS MÁS VENDIDOS
            const conteoProductos = {};
            pedidos.forEach(pedido => {
                pedido.productos.forEach(prod => {
                    conteoProductos[prod.nombre] = (conteoProductos[prod.nombre] || 0) + 1;
                });
            });

            // VENTAS POR MES
            const ventasPorMes = {};
            const nombresMeses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

            pedidos.forEach(pedido => {
                if (pedido.fecha) {
                    const fechaObj = new Date(pedido.fecha);
                    const mes = nombresMeses[fechaObj.getMonth()]; // Obtiene el nombre del mes (ej. "Ago")
                    ventasPorMes[mes] = (ventasPorMes[mes] || 0) + pedido.total; // Suma los ingresos
                }
            });

            // Evitar que las gráficas se dupliquen al recargar el panel
            if (window.chartProd) window.chartProd.destroy();
            if (window.chartMeses) window.chartMeses.destroy();

            // Dibujar Gráfica 1: Productos Más Vendidos (Gráfico de Pastel)
            const ctxProd = document.getElementById('graficaProductos').getContext('2d');
            window.chartProd = new Chart(ctxProd, {
                type: 'pie',
                data: {
                    labels: Object.keys(conteoProductos),
                    datasets: [{
                        label: 'Unidades Vendidas',
                        data: Object.values(conteoProductos),
                        backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#0dcaf0', '#6f42c1']
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Accesorios Más Vendidos' } } }
            });

            // Dibujar Gráfica 2: Ventas por Mes (Gráfico de Barras)
            const ctxMeses = document.getElementById('graficaMeses').getContext('2d');
            window.chartMeses = new Chart(ctxMeses, {
                type: 'bar',
                data: {
                    labels: Object.keys(ventasPorMes),
                    datasets: [{
                        label: 'Ingresos Totales ($)',
                        data: Object.values(ventasPorMes),
                        backgroundColor: '#198754'
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Ingresos por Mes' } } }
            });
        }
    </script>
</body>

</html>
