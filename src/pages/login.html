<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ElectroNova - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/css.css">
</head>
<body class="bg-light">
    <div id="header-container"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4 border-0 rounded-3">
                    <h3 class="text-center mb-4 fw-bold">Iniciar Sesión</h3>
                    <form onsubmit="procesarLogin(event)" id="formLogin" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" oninput="validarCorreo(this)" required>
                            <div class="invalid-feedback">Ingrese un formato de correo válido (ej. usuario@correo.com).</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="loginPass" oninput="validarPass(this)" required>
                            <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => cargarHeader('header-container'));

        function validarCorreo(input) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (regex.test(input.value)) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                return true;
            } else {
                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                return false;
            }
        }

        function validarPass(input) {
            if (input.value.length >= 6) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                return true;
            } else {
                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                return false;
            }
        }

        function procesarLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPass');
            
            if (!validarCorreo(emailInput) || !validarPass(passInput)) {
                Swal.fire({ icon: 'warning', title: 'Campos incompletos', text: 'Por favor, corrija los errores en el formulario antes de continuar.' });
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            const usuarioEncontrado = usuarios.find(u => u.email === emailInput.value && u.password === passInput.value);

            if (usuarioEncontrado) {
                localStorage.setItem('sesionActual', JSON.stringify(usuarioEncontrado));
                Swal.fire({
                    icon: 'success', title: '¡Bienvenido!', text: `Hola, ${usuarioEncontrado.nombre}`, showConfirmButton: false, timer: 1500
                }).then(() => {
                    window.location.href = usuarioEncontrado.rol === 'admin' ? 'admin.html' : '../../index.html';
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Error de Autenticación', text: 'El correo o la contraseña son incorrectos.' });
            }
        }
    </script>
</body>
</html>
