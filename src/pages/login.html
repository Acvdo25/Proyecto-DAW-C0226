<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link rel="stylesheet" href="../css/css.css">
</head>

<body class="bg-light">
    <div id="header-container"></div>
    <div id="react-root" class="container mt-5 mb-5"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof cargarHeader === 'function') cargarHeader('header-container');
            fetch('../layout/footer.html')
                .then(res => res.ok ? res.text() : Promise.reject('Error footer'))
                .then(html => document.getElementById('footer-container').innerHTML = html)
                .catch(err => console.error(err));
        });
    </script>

    <script type="text/babel">
        const { useState } = React;

        function LoginReact() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const manejarSubmit = (e) => {
                e.preventDefault();
                const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
                const usuario = usuarios.find(u => u.email === email && u.password === password);

                if (usuario) {
                    localStorage.setItem('sesionActual', JSON.stringify(usuario));
                    Swal.fire({
                        icon: 'success',
                        title: `¡Bienvenido de nuevo!`,
                        text: usuario.nombre,
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = usuario.rol === 'admin' ? 'admin.html' : '../../index.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de acceso',
                        text: 'Credenciales incorrectas. Verifique su correo y contraseña.'
                    });
                }
            };

            return (
                <div className="row justify-content-center">
                    <div className="col-md-5">
                        <div className="card shadow p-4 border-0 rounded-3 bg-white">
                            <div className="text-center mb-4">
                                <div className="bg-primary text-white d-inline-block rounded-circle p-3 mb-3">
                                    <i className="fa-solid fa-user fa-2x"></i>
                                </div>
                                <h3 className="fw-bold text-dark">Iniciar Sesión</h3>
                            </div>
                            <form onSubmit={manejarSubmit}>
                                <div className="mb-3">
                                    <label className="form-label fw-semibold text-secondary">Correo Electrónico</label>
                                    <div className="input-group">
                                        <span className="input-group-text bg-light"><i className="fa-solid fa-envelope text-muted"></i></span>
                                        <input type="email" className="form-control" value={email} onChange={(e) => setEmail(e.target.value)} required placeholder="ejemplo@correo.com" />
                                    </div>
                                </div>
                                <div className="mb-4">
                                    <label className="form-label fw-semibold text-secondary">Contraseña</label>
                                    <div className="input-group">
                                        <span className="input-group-text bg-light"><i className="fa-solid fa-lock text-muted"></i></span>
                                        <input type="password" className="form-control" value={password} onChange={(e) => setPassword(e.target.value)} required placeholder="••••••••" />
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary w-100 fw-bold py-2 shadow-sm">Ingresar al Sistema</button>
                            </form>
                            <div className="text-center mt-4">
                                <p className="text-muted small">¿No tienes una cuenta? <a href="registro.html" className="text-decoration-none fw-semibold">Regístrate aquí</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(<LoginReact />);
    </script>
</body>

</html>
