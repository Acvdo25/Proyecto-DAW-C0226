<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/css.css">
</head>

<body>
    <div id="header-container"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3">Iniciar Sesión</h3>
                    <form onsubmit="procesarLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPass" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => renderizarNavbar('menuNavbar'));

        function procesarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const usuarioEncontrado = usuarios.find(u => u.email === email && u.password === pass);
            if (usuarioEncontrado) {
                localStorage.setItem('sesionActual', JSON.stringify(usuarioEncontrado));
                alert(`¡Bienvenido, ${usuarioEncontrado.nombre}!`);
                if (usuarioEncontrado.rol === 'admin') {
                    window.location.href = 'admin.html'; // Si es admin, se queda en la carpeta pages
                } else {
                    window.location.href = '../../index.html'; // Si es cliente, sale de pages y va al index principal
                }
            } else {
                alert('Credenciales incorrectas.');
            }
        }
    </script>
</body>

</html>
