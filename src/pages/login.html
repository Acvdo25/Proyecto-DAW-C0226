<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ANEON - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/css.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div id="header-container"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3">Iniciar Sesión</h3>
                    <form onsubmit="procesarLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPass" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');
        });

        function procesarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const usuarioEncontrado = usuarios.find(u => u.email === email && u.password === pass);
            if (usuarioEncontrado) {
                localStorage.setItem('sesionActual', JSON.stringify(usuarioEncontrado));

                Swal.fire({
                    icon: 'success',
                    title: '¡Bienvenido!',
                    text: `Hola, ${usuarioEncontrado.nombre}`,
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    if (usuarioEncontrado.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = '../../index.html';
                    }
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Autenticación',
                    text: 'Credenciales incorrectas. Intente nuevamente.'
                });
            }
        }
    </script>
</body>

</html>
