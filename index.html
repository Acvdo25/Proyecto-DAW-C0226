<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEON Store - Catálogo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="src/css/css.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- CONTENEDOR DONDE SE CARGARÁ EL HEADER DINÁMICAMENTE -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DE LA VISTA -->
    <div class="container my-4">
        <div class="hero-section text-center rounded mb-4 shadow">
            <h1>Accesorios Electrónicos de Alta Calidad</h1>
            <p class="lead">Encuentra cargadores, audífonos, smartwatches y más al alcance de un clic.</p>
        </div>
        <div class="row" id="contenedorCatalogo">
            <!-- Los productos se cargan por JavaScript -->
        </div>
    </div>

    <div id="idFooter"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader('header-container');
            cargarCatalogo();
        });

        function cargarCatalogo() {
            const productos = JSON.parse(localStorage.getItem('productos')) || [];
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            const sesion = getSesionActual();
            const contenedor = document.getElementById('contenedorCatalogo');
            
            contenedor.innerHTML = productos.map(p => {
                // Verificar si este producto ya está en los favoritos del usuario actual
                let esFavorito = false;
                if (sesion) {
                    esFavorito = wishlist.some(item => item.id === p.id && item.email === sesion.email);
                }
                const corazonColor = esFavorito ? 'text-danger' : 'text-secondary';
                const corazonIcono = esFavorito ? 'fa-solid fa-heart' : 'fa-regular fa-heart';

                return `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 product-card shadow-sm position-relative">
                        <!-- Botón de Favorito Flotante -->
                        <button class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow-sm" 
                                onclick="toggleWishlist(${p.id})" style="z-index: 10;">
                            <i class="${corazonIcono} ${corazonColor} fs-5"></i>
                        </button>
                        
                        <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-secondary mb-2 align-self-start">${p.categoria}</span>
                            <h5 class="card-title">${p.nombre}</h5>
                            <p class="card-text text-success fw-bold fs-5">$${p.precio.toFixed(2)}</p>
                            <p class="card-text text-muted small">Stock disponible: ${p.stock}</p>
                            <button class="btn btn-primary mt-auto" onclick="agregarAlCarrito(${p.id})">
                                <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function agregarAlCarrito(id) {
            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'cliente') {
                Swal.fire({
                    icon: 'warning',
                    title: 'Acceso Denegado',
                    text: 'Debe iniciar sesión como cliente para comprar.'
                }).then(() => {
                    window.location.href = 'src/pages/login.html';
                });
                return;
            }
            let productos = JSON.parse(localStorage.getItem('productos'));
            let producto = productos.find(p => p.id === id);
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

            carrito.push(producto);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            cargarHeader('header-container');

            // SweetAlert estilo Toast (Notificación pequeña)
            Swal.fire({
                icon: 'success',
                title: '¡Agregado!',
                text: `"${producto.nombre}" se agregó al carrito.`,
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000
            });
        }
    </script>
</body>

</html>
