<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEON - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link rel="stylesheet" href="src/css/css.css">
</head>

<body>
    <div id="header-container"></div>

    <div class="container my-4">
        <div class="bg-primary bg-gradient text-white text-center p-5 rounded mb-5 shadow">
            <h1 class="fw-bold"><i class="fa-solid fa-bolt text-warning"></i> ANEON</h1>
            <p class="lead mb-0">Accesorios Electrónicos de Alta Calidad</p>
        </div>

        <div id="react-root"></div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof cargarHeader === 'function') cargarHeader('header-container');

            fetch('src/layout/footer.html')
                .then(response => {
                    if (response.ok) return response.text();
                    throw new Error('Footer no encontrado');
                })
                .then(html => document.getElementById('footer-container').innerHTML = html)
                .catch(err => console.error(err));
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CatalogoTienda() {
            const [productosLocales, setProductosLocales] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const sesion = window.getSesionActual ? window.getSesionActual() : null;

            useEffect(() => {
                setProductosLocales(JSON.parse(localStorage.getItem('productos')) || []);
                setWishlist(JSON.parse(localStorage.getItem('wishlist')) || []);

            }, []);

            const manejarFavorito = (idProducto) => {
                if (!sesion || sesion.rol !== 'cliente') {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Restringido',
                        text: 'Debe iniciar sesión para guardar favoritos.'
                    }).then(() => {
                        window.location.href = 'src/pages/login.html';
                    });
                    return;
                }

                let currentWishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const index = currentWishlist.findIndex(item => item.id === idProducto && item.email === sesion.email);

                if (index > -1) {
                    currentWishlist.splice(index, 1);
                } else {
                    const prod = productosLocales.find(p => p.id === idProducto);
                    if (prod) currentWishlist.push({ ...prod, email: sesion.email });
                }

                localStorage.setItem('wishlist', JSON.stringify(currentWishlist));
                setWishlist(currentWishlist);
            };

            const agregarAlCarritoReact = (idProducto) => {
                if (!sesion || sesion.rol !== 'cliente') {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Restringido',
                        text: 'Debe iniciar sesión como cliente para comprar.'
                    }).then(() => {
                        window.location.href = 'src/pages/login.html';
                    });
                    return;
                }

                let producto = productosLocales.find(p => p.id === idProducto);
                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                carrito.push(producto);
                localStorage.setItem('carrito', JSON.stringify(carrito));

                if (typeof window.cargarHeader === 'function') window.cargarHeader('header-container');

                Swal.fire({
                    icon: 'success',
                    title: '¡Agregado!',
                    text: `"${producto.nombre}" se agregó al carrito.`,
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 2000
                });
            };

            const renderTarjeta = (p) => {
                let esFavorito = false;
                if (sesion) {
                    esFavorito = wishlist.some(item => item.id === p.id && item.email === sesion.email);
                }

                const corazonColor = esFavorito ? 'text-danger' : 'text-secondary';
                const corazonIcono = esFavorito ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                const idProd = p.id;
                const nombre = p.nombre;
                const precio = p.precio;
                const imagen = p.imagen;
                const categoria = p.categoria;

                return (
                    <div className="col-md-4 col-lg-3 mb-4" key={idProd}>
                        <div className="card h-100 shadow-sm border position-relative bg-white">
                            {(
                                <button className="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow border d-flex align-items-center justify-content-center"
                                    onClick={() => manejarFavorito(p.id)} style={{ zIndex: 10, width: '40px', height: '40px' }}>
                                    <i className={`${corazonIcono} ${corazonColor} fs-5`}></i>
                                </button>
                            )}

                            <div className="bg-white p-4 text-center rounded-top">
                                <img src={imagen} className="img-fluid" alt={nombre} style={{ height: '180px', objectFit: 'contain' }} />
                            </div>

                            <div className="card-body d-flex flex-column border-top bg-light">
                                <span className="badge bg-secondary mb-3 align-self-start">{categoria}</span>
                                <h6 className="card-title text-dark fw-semibold mb-2">{nombre}</h6>
                                <p className="card-text text-success fw-bold fs-4 mb-3">${parseFloat(precio).toFixed(2)}</p>

                                <p className="card-text text-muted small mb-4">Stock disponible: {p.stock}</p>

                                <button className="btn btn-outline-primary mt-auto w-100 fw-medium"
                                    onClick={() => agregarAlCarritoReact(p.id)}>
                                    <i className="fa-solid fa-cart-plus me-1"></i> Agregar al Carrito
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    <h3 className="fw-bold mb-4 text-white "><i className="fa-solid fa-store text-primary"></i> Nuestro Catálogo</h3>
                    <div className="row">
                        {productosLocales.length > 0 ? productosLocales.map(p => renderTarjeta(p)) : <div className="col-12"><p className="text-muted">No hay productos locales disponibles.</p></div>}
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(<CatalogoTienda />);
    </script>
</body>

</html>
