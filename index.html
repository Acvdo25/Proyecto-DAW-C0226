<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroNova Store - Catálogo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .hero-section {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 40px 0;
        }

        .product-card img {
            height: 180px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- CONTENEDOR DONDE SE CARGARÁ EL HEADER DINÁMICAMENTE -->
    <div id="header-container"></div>

    <!-- CONTENEDOR PRINCIPAL DE LA VISTA -->
    <div class="container my-4">
        <div class="hero-section text-center rounded mb-4 shadow">
            <h1>Accesorios Electrónicos de Alta Calidad</h1>
            <p class="lead">Encuentra cargadores, audífonos, smartwatches y más al alcance de un clic.</p>
        </div>
        <div class="row" id="contenedorCatalogo">
            <!-- Los productos se cargan por JavaScript -->
        </div>
    </div>

    <div class="idFooter"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPT PRINCIPAL -->
    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar el navbar externo
            cargarHeader('header-container');
            // Cargar el catálogo de productos
            cargarCatalogo();
        });

        function cargarCatalogo() {
            const productos = JSON.parse(localStorage.getItem('productos')) || [];
            const contenedor = document.getElementById('contenedorCatalogo');

            contenedor.innerHTML = productos.map(p => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 product-card shadow-sm">
                        <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-secondary mb-2 align-self-start">${p.categoria}</span>
                            <h5 class="card-title">${p.nombre}</h5>
                            <p class="card-text text-success fw-bold fs-5">$${p.precio.toFixed(2)}</p>
                            <p class="card-text text-muted small">Stock disponible: ${p.stock}</p>
                            <button class="btn btn-primary mt-auto" onclick="agregarAlCarrito(${p.id})"><i class="fa-solid fa-cart-plus"></i> Agregar al Carrito</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function agregarAlCarrito(id) {
            const sesion = getSesionActual();
            if (!sesion || sesion.rol !== 'cliente') {
                alert('Debe iniciar sesión como cliente para comprar.');
                window.location.href = 'src/pages/login.html';
                return;
            }
            let productos = JSON.parse(localStorage.getItem('productos'));
            let producto = productos.find(p => p.id === id);
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

            carrito.push(producto);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            cargarHeader('header-container'); // Actualizar contador del carrito en el navbar
            alert(`"${producto.nombre}" agregado al carrito.`);
        }
    </script>
</body>

</html>
